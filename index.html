<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>講義アシスト</title>
<style>
/* 教室で開きっぱなしにする道具。暗い画面を既定にし、黄色は「質問」だけに使う。 */
:root{
  --bg:#0f1317; --panel:#161c22; --panel2:#111a1a; --fg:#e6edf3; --muted:#8b96a3; --line:#2a333d;
  --q:#ffd54f; --q-fg:#1a1200; --q-weak:#7a4a00; --q-weak-fg:#ffe082; --ans:#80cbc4; --accent:#4fc3f7; --danger:#ef9a9a; --ok:#66bb6a;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f6f7f8; --panel:#ffffff; --panel2:#eef5f4; --fg:#161b22; --muted:#5b6673; --line:#d6dce3;
  --q:#ffd54f; --q-fg:#1a1200; --q-weak:#ffe8a3; --q-weak-fg:#5a3b00; --ans:#00796b; --accent:#0277bd; --danger:#c62828; --ok:#2e7d32;
  color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f6f7f8; --panel:#ffffff; --panel2:#eef5f4; --fg:#161b22; --muted:#5b6673; --line:#d6dce3;
  --q:#ffd54f; --q-fg:#1a1200; --q-weak:#ffe8a3; --q-weak-fg:#5a3b00; --ans:#00796b; --accent:#0277bd; --danger:#c62828; --ok:#2e7d32;
  color-scheme:light; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
#status{flex:1 1 200px;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meter{width:120px;height:12px;background:var(--panel);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
#meterBar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ok)}
#meterThr{position:absolute;top:0;bottom:0;width:2px;background:#ff9800}
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#00131c;border-color:transparent;font-weight:600}
button.stop{background:#c62828;color:#fff;border-color:transparent;font-weight:600}
main{flex:1;display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,2fr);gap:10px;padding:10px 16px;min-height:0}
@media (max-width:760px){ main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.2fr) minmax(0,1fr)} }
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0}
.pane h2{font-size:12px;color:var(--muted);margin:0;padding:8px 12px;border-bottom:1px solid var(--line);letter-spacing:.06em;text-transform:uppercase}
.scroll{flex:1;overflow-y:auto;padding:10px 12px;min-height:0;-webkit-overflow-scrolling:touch}
#side{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1.4fr);gap:10px;min-height:0}
.line{margin:0 0 8px;font-size:17px;cursor:pointer;border-left:3px solid transparent;padding-left:6px;-webkit-tap-highlight-color:transparent}
.line:active{opacity:.6}
.line.manual{border-left-color:var(--accent)}
.line.manual .tx::after{content:" 👆";font-size:12px}
.line .ts{color:var(--muted);font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}
.line.q2 .tx{background:var(--q);color:var(--q-fg);font-weight:700;padding:2px 6px;border-radius:4px}
.line.q1 .tx{background:var(--q-weak);color:var(--q-weak-fg);font-weight:600;padding:2px 6px;border-radius:4px}
.line .why{color:var(--muted);font-size:11px;margin-left:6px}
.qitem{margin:0 0 8px;font-size:15px;color:var(--q)}
.qitem.weak{color:var(--q-weak-fg)}
.qitem .ts{color:var(--muted);font-size:11px;margin-right:6px}
.ans{margin:0 0 14px;padding:10px 12px;background:var(--panel2);border-radius:8px;border-left:3px solid var(--ans)}
.ans .q{font-size:12px;color:var(--q);margin:0 0 4px}
.ans .judge{font-size:12px;color:var(--ans);margin:0 0 4px}
.ans .a{font-size:19px;font-weight:700;margin:0 0 6px}
.ans p{margin:0 0 4px;font-size:15px}
.ans .err{color:var(--danger);font-size:13px}
.ans .thinking{color:var(--muted);font-size:14px}
footer{display:flex;gap:8px;padding:8px 16px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
footer .spacer{flex:1}
#count{font-size:12px;color:var(--muted)}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0;width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:16px;max-height:90vh;overflow-y:auto}
dialog h3{margin:0;font-size:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=password],select,textarea{font:inherit;font-size:15px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>label{flex:1 1 200px}
.hint{font-size:12px;color:var(--muted);margin:0}
.notice{font-size:13px;color:var(--muted);padding:10px 12px}
@media (prefers-reduced-motion: no-preference){ body.flash{animation:flash 1.2s ease-out} @keyframes flash{0%{background:#3a3000}100%{background:var(--bg)}} }
/* 目立たない表示: 入力レベルのバーを消し、検知時の画面の点滅を止め、黄色の帯を細い下線に落とす */
body.quiet #meter{display:none}
body.quiet.flash{animation:none}
body.quiet .line.q2 .tx,body.quiet .line.q1 .tx{background:transparent;color:var(--fg);padding:0;border-radius:0;border-bottom:2px solid var(--q);font-weight:600}
body.quiet .line.q1 .tx{border-bottom-style:dotted}
body.quiet .qitem{color:var(--fg)}
body.quiet .qitem.weak{color:var(--muted)}
.line.partial .tx{opacity:.55}
</style>
</head>
<body>
<header>
  <h1>講義アシスト</h1>
  <div id="status">設定（右下の歯車）でキーと科目を入れてから開始</div>
  <div id="meter" aria-hidden="true"><div id="meterBar"></div><div id="meterThr"></div></div>
  <button id="btnStart" class="primary">開始</button>
</header>
<main>
  <section class="pane" aria-label="文字起こし">
    <h2>文字起こし</h2>
    <div id="transcript" class="scroll"><p class="notice">開始を押すとマイクの許可を求める。先生の声が0.6秒以上途切れるごとに1文ずつ出る。質問と判定した文は黄色。判定されなかった文も、タップすれば必ず質問として答える。出た答えが違うときは、その回答候補をタップすると「別の答え」を出す。ログは1文ごとにこの端末に自動保存され、ページが読み直されても戻る。</p></div>
  </section>
  <section id="side">
    <div class="pane" aria-label="検知した質問">
      <h2>検知した質問</h2>
      <div id="qlog" class="scroll"></div>
    </div>
    <div class="pane" aria-label="回答候補">
      <h2 id="ansHead">回答候補</h2>
      <div id="alog" class="scroll"></div>
    </div>
  </section>
</main>
<footer>
  <button id="btnClear">クリア</button>
  <button id="btnSave">ログ保存</button>
  <button id="btnCopy">ログをコピー</button>
  <button id="btnRec" hidden>録音を保存</button>
  <span class="spacer"></span>
  <span id="count">質問 0 件</span>
  <button id="btnSettings" aria-label="設定">⚙ 設定</button>
</footer>

<dialog id="dlg">
  <form method="dialog" id="settingsForm">
    <h3>設定</h3>
    <div class="row">
      <label>科目名<input type="text" id="course" placeholder="内部統制論"></label>
    </div>
    <div class="row">
      <label>Gemini APIキー（文字起こし）<input type="password" id="gkey" autocomplete="off" placeholder="AIza..."></label>
      <label>文字起こしモデル<select id="asrModel"><option value="gemini-3.5-flash">gemini-3.5-flash（既定）</option><option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite（速い）</option><option value="gemini-3.8-flash">gemini-3.8-flash</option><option value="oai-rt">OpenAI リアルタイム（gpt-4o-transcribe・話している途中から出る）</option><option value="oai-rt-mini">OpenAI リアルタイム mini（速くて安い）</option></select></label>
      <label>OpenAI APIキー（リアルタイムを選んだ時だけ）<input type="password" id="okey" autocomplete="off" placeholder="sk-..."></label>
    </div>
    <div class="row">
      <label>回答候補の提供元<select id="llm"><option value="sonnet">Claude Sonnet（既定・賢い）</option><option value="claude">Claude Haiku（0.5〜1秒速い）</option><option value="gemini">Gemini Flash</option><option value="off">出さない（検知だけ）</option></select></label>
      <label>Anthropic APIキー（Claudeを使う時）<input type="password" id="akey" autocomplete="off" placeholder="sk-ant-..."></label>
    </div>
    <div class="row">
      <label>無音と見なす秒数<select id="silence"><option value="0.5">0.5</option><option value="0.6" selected>0.6</option><option value="0.8">0.8</option><option value="1.0">1.0</option></select></label>
      <label><span>疑い（橙）にも回答候補</span><select id="answerWeak"><option value="yes" selected>出す</option><option value="no">出さない</option></select></label>
      <label><span>マイクの音声処理</span><select id="rawMic"><option value="raw" selected>切る（遠くの声向け）</option><option value="auto">端末に任せる</option></select></label>
      <label><span>表示</span><select id="quiet"><option value="no" selected>通常</option><option value="yes">目立たない（バー非表示・点滅なし・黄色は下線だけ）</option></select></label>
      <label><span>文字起こしに用語を渡す</span><select id="asrVocab"><option value="no" selected>渡さない（素の文字起こし）</option><option value="yes">レジュメの用語を渡す（無音時に捏造しやすい）</option></select></label>
      <label><span>録音も残す</span><select id="rec"><option value="yes" selected>残す（停止後に「録音を保存」で書き出す）</option><option value="no">残さない</option></select></label>
    </div>
    <div class="row">
      <label>GitHubトークン（gist権限だけ。入れるとログを自分の秘密のgistへ送り続け、別の端末から読める）<input type="password" id="ghtoken" autocomplete="off" placeholder="ghp_..."></label>
    </div>
    <p class="hint" id="gistInfo">共有なし</p>
    <label>レジュメ（PDF か テキスト。回答の根拠と、用語の聞き取りに使う）
      <input type="file" id="notesFile" accept=".pdf,.txt,.md,text/plain,application/pdf">
    </label>
    <label>レジュメの本文（貼り付けでも可）<textarea id="notes" placeholder="ここに貼るか、上でファイルを選ぶ"></textarea></label>
    <p class="hint" id="notesInfo">レジュメなし</p>
    <p class="hint">キーとレジュメはこの端末のブラウザにだけ保存される。</p>
    <div class="row">
      <button type="submit" class="primary" id="btnSaveSettings">保存して閉じる</button>
      <button type="button" id="btnCancelSettings">キャンセル</button>
    </div>
  </form>
</dialog>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const SR = 16000, BLOCK = 1600;
const GEMINI_URL = (m) => 'https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent';
const ANTHROPIC_URL = 'https://api.anthropic.com/v1/messages';
const LS_KEY = 'lq_settings_v1';

/* ---------------- 設定 ---------------- */
const defaults = { course:'', gkey:'', akey:'', asrModel:'gemini-3.5-flash', okey:'', llm:'sonnet', silence:'0.6', answerWeak:'yes', rawMic:'raw', quiet:'no', rec:'yes', asrVocab:'no', ghtoken:'', notes:'', notesName:'' };
let cfg = Object.assign({}, defaults);
function loadCfg(){ try { const s = localStorage.getItem(LS_KEY); if (s) cfg = Object.assign({}, defaults, JSON.parse(s)); } catch (e) {} }
function saveCfg(){ try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) {} }
function applyQuiet(){ document.body.classList.toggle('quiet', cfg.quiet === 'yes'); }
function cfgToForm(){ for (const k of ['course','gkey','akey','asrModel','okey','llm','silence','answerWeak','rawMic','quiet','rec','asrVocab','ghtoken','notes']) { const el = $(k); if (el) el.value = cfg[k] || ''; } updateNotesInfo(); }
function formToCfg(){ for (const k of ['course','gkey','akey','asrModel','okey','llm','silence','answerWeak','rawMic','quiet','rec','asrVocab','ghtoken','notes']) { const el = $(k); if (el) cfg[k] = (el.value || '').trim(); } }
function updateNotesInfo(){ const n = ($('notes').value || '').length; $('notesInfo').textContent = n ? ('レジュメ ' + n.toLocaleString() + ' 文字' + (cfg.notesName ? '（' + cfg.notesName + '）' : '')) : 'レジュメなし'; }

/* ---------------- 用語バイアス ---------------- */
const STOP = new Set('講義 本日 予定 以下 以上 場合 必要 可能 当該 一定 理解 説明 参考 資料 内容 全体 部分 関係 関連 重要 基本 具体 具体的 一般 一般的 今回 次回 前回 担当 講師 大学 大学院 研究 研究科 関西 学院 関西学院 株式 会社 株式会社 取組 取り組み 実施 対応 活用 提供 次第 以降 以前 現在 当時 年度 日本 米国 世界 会計 経営 事業 業務 企業 組織 制度 概念 本質 目的 目標 検討 議論 水準 程度'.split(' '));
function buildVocab(text, limit){
  limit = limit || 110; const cnt = new Map();
  const add = (m) => { for (const t of m) cnt.set(t, (cnt.get(t) || 0) + 1); };
  if (text) { add(text.match(/[一-龥々]{2,8}/g) || []); add((text.match(/[ァ-ヴー・]{3,}/g) || []).map(s => s.replace(/^・+|・+$/g, ''))); add(text.match(/[A-Z][A-Za-z\-]{1,}[A-Z0-9a-z]*/g) || []); }
  const terms = [];
  const sorted = [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 300);
  for (const [t, n] of sorted) { if (n < 2 || STOP.has(t) || terms.includes(t) || /^[0-9０-９年月日]+$/.test(t) || t.length < 2) continue; terms.push(t); }
  const out = []; let total = 0;
  for (const t of terms) { if (total + t.length + 1 > limit) continue; out.push(t); total += t.length + 1; }
  return out.join('、');
}

/* ---------------- 質問検知 ---------------- */
const INTERROG = /(何|なに|なん|なぜ|どうして|どう|どの|どれ|どこ|誰|だれ|いつ|いくつ|いくら|どんな|どのよう|どちら|どっち|いかが)/;
const STRONG = [/分か(る|り)(人|方|ます)/, /わか(る|り)(人|方|ます)/, /知って(る|いる)(人|方)/, /知っていますか/, /答えられ(る|ます)/, /言える(人|方)/, /(誰|だれ|どなた)か(?!ら)/, /(人|方|の|は|が)いますか/, /手を挙げ/, /挙手/, /どう思(う|い)/, /どうです/, /いかが/, /どうでしょう/, /と思います?か/, /考えてみ/, /聞いてみ/, /何でしょう/, /なんでしょう/, /何だと思/, /なんだと思/, /どれでしょう/, /なぜでしょう/, /どうしてでしょう/, /説明(できる|できます|して(みて|もら))/, /何が違/, /違いは/, /ありますか/, /ないですか/, /ませんか/];
const END_Q = /(か|のか|ですか|ますか|でしょうか|だろうか|ませんか|ましょうか)$/;
const END_Q_WEAK = /(かな|かね|ですかね|ますかね|ですかな)$/;
const END_FILLER = /(というか|と言いますか|といいますか|いいますか|というのか|なんか|とか|ばかりか|どころか|ほか|せいか|ためか)$/;
const END_SOFT = /(でしょう|だろう|と思います|と思う|ですよね|でしょ|よね)$/;
const INTERROG_NEG = /((どの|どんな|どこ|誰|だれ|何|なに|いつ)\S{0,6}(でも|であっても|にも|にせよ|だって)|(何|なに)か(?!$)|いくつか|いつか)/;
const ENUM = /か\S{1,10}か$/, ENUM_NEG = /(でしょう|ます|です|ません|ない|いる|ある|する|ている|の)か$/;
const TAIL = /[。．、，!！…・「」『』\s]+$/, HEAD = /^[。．、，!！…・「」『』\s]+/;
function detectQuestion(text){
  let t = text.replace(TAIL, '').replace(HEAD, ''); if (!t) return [0, ''];
  const hasQ = /[?？]/.test(text);
  const body = t.replace(/[?？]+$/, '').replace(TAIL, '');
  let score = 0; const reasons = [];
  if (hasQ) { score += 2; reasons.push('？'); }
  if (END_Q_WEAK.test(body)) { score += 2; reasons.push('文末かな'); }
  else if (END_Q.test(body) && !END_FILLER.test(body)) { score += 3; reasons.push('文末か'); if (ENUM.test(body) && !ENUM_NEG.test(body)) { score -= 1; reasons.push('列挙'); } }
  for (const p of STRONG) { if (p.test(body)) { score += 3; reasons.push('呼びかけ'); break; } }
  if (INTERROG.test(body) && !INTERROG_NEG.test(body)) { score += 1; reasons.push('疑問詞'); if (END_SOFT.test(body)) score += 1; }
  if (/(皆さん|みなさん|みんな|あなた|君|さん、)/.test(body)) { score += 1; reasons.push('対象'); }
  const why = [...new Set(reasons)].join('・');
  if (score >= 3) return [2, why]; if (score === 2) return [1, why]; return [0, ''];
}

/* ---------------- 音声 ---------------- */
const A = { running:false, ctx:null, stream:null, proc:null, src:null, gain:null, resample:null, pending:new Float32Array(0), wake:null,
  noise:0.004, buf:[], preroll:[], speechBlocks:0, trailing:0, collecting:false, chunkQ:[], busy:false, recent:[], qid:0, lastSent:['',0], nq:0, lines:[], vocab:'',
  cbCount:0, rawPeak:0, loud:0.002, agc:1, diagTimer:null, lastSeg:'', lastCb:0, lastMicRetry:0, micRetries:0, recovering:false };
function makeResampler(inRate, outRate){
  const ratio = inRate / outRate; const win = Math.max(1, Math.round(ratio)); let carry = new Float32Array(0); let pos = 0;
  return (input) => {
    const x = new Float32Array(carry.length + input.length); x.set(carry); x.set(input, carry.length);
    const n = x.length; const out = [];
    while (pos + win <= n) { let s = 0; const b = Math.floor(pos); for (let k = 0; k < win; k++) s += x[b + k]; out.push(s / win); pos += ratio; }
    const keep = Math.floor(pos); carry = x.slice(keep); pos -= keep; return Float32Array.from(out);
  };
}
// dB目盛（-60dB〜0dB を 0〜120px）。小さい音でも動きが見えるように対数にする
function px(v){ const db = 20 * Math.log10(Math.max(v, 1e-6)); return Math.max(0, Math.min(120, (db + 60) / 60 * 120)); }
function setMeter(rms, thr, sp){ if (cfg.quiet === 'yes') return; $('meterBar').style.width = px(rms) + 'px'; $('meterBar').style.background = sp ? 'var(--ok)' : '#2e7d32'; $('meterThr').style.left = Math.min(118, px(thr)) + 'px'; }
function onBlock(blk){
  let s = 0; for (let i = 0; i < blk.length; i++) s += blk[i] * blk[i]; const rms = Math.sqrt(s / blk.length) + 1e-9;
  if (rms < A.noise * 1.5) A.noise = 0.95 * A.noise + 0.05 * rms;
  const thr = Math.max(A.noise * 3, 0.006); const sp = rms > thr; setMeter(rms, thr, sp);
  if (isRt()) return;    // ストリーミングでは区切りも無音判定もサーバー側
  const silBlocks = Math.max(1, Math.round(parseFloat(cfg.silence || '0.6') / 0.1)), maxBlocks = 120, minSpeech = 8;
  if (!A.collecting) { A.preroll.push(blk); if (A.preroll.length > 3) A.preroll.shift(); if (sp) { A.collecting = true; A.buf = A.preroll.slice(); A.preroll = []; A.speechBlocks = 1; A.trailing = 0; } return; }
  A.buf.push(blk); if (sp) { A.speechBlocks++; A.trailing = 0; } else A.trailing++;
  if (A.trailing >= silBlocks || A.buf.length >= maxBlocks) {

  let qid = null; const minLevel = cfg.answerWeak === 'yes' ? 1 : 2;
  if (cfg.llm !== 'off' && lv >= minLevel && !(tx === A.lastSent[0] && Date.now() - A.lastSent[1] < 10000)) {
    qid = ++A.qid; A.lastSent = [tx, Date.now()]; const ctx = A.recent.slice(0, -1).slice(-24).join('\n'); askAnswer(qid, tx, ctx);
  }
  A.lines.push({ kind:'seg', t: now, text: tx, level: lv }); scheduleLogSave();
  const tr = $('transcript'); const notice = tr.querySelector('.notice'); if (notice) notice.remove();
  const p = document.createElement('p'); p.className = 'line' + (lv === 2 ? ' q2' : lv === 1 ? ' q1' : '');
  p.dataset.text = tx; p.dataset.ts = ts;
  p.innerHTML = '<span class="ts">' + ts + '</span><span class="tx"></span>' + (lv ? '<span class="why"></span>' : '');
  p.querySelector('.tx').textContent = (lv === 2 ? '❓ ' : lv === 1 ? '? ' : '') + tx;
  if (lv) p.querySelector('.why').textContent = '← ' + (lv === 2 ? '質問' : '質問？') + '（' + why + '）';
  tr.appendChild(p); tr.scrollTop = tr.scrollHeight;
  if (lv) {
    A.nq++; $('count').textContent = '質問 ' + A.nq + ' 件';
    const q = document.createElement('p'); q.className = 'qitem' + (lv === 1 ? ' weak' : ''); q.dataset.text = tx; q.dataset.ts = ts; q.innerHTML = '<span class="ts">' + ts + '</span><span></span>'; q.querySelector('span:last-child').textContent = tx; $('qlog').appendChild(q); $('qlog').scrollTop = $('qlog').scrollHeight;
    if (lv === 2) { document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash'); }
    if (qid) { const a = document.createElement('div'); a.className = 'ans'; a.id = 'ans' + qid; a.dataset.text = tx; a.dataset.ts = ts; a.innerHTML = '<p class="q"></p><p class="thinking">考え中…</p>'; a.querySelector('.q').textContent = 'Q: ' + tx; $('alog').appendChild(a); $('alog').scrollTop = $('alog').scrollHeight; }
  }
  A.lastSeg = tx; A.lastSegAt = Date.now();
  setStatus('遅れ ' + lat.toFixed(1) + '秒（処理 ' + proc.toFixed(1) + '秒／音声 ' + sec.toFixed(1) + '秒）  待ち ' + A.chunkQ.length);
}

/* ---------------- 手動で質問として送る（タップ＝指名） ----------------
   文字起こしの行・「検知した質問」の項目・回答候補の箱（判定が「質問ではない」か失敗のもの）のどれをタップしても、
   その文を質問として強制的に答えさせる。判定は飛ばし、短い発言でも直前の文脈から問いを推定して答える。 */
function manualAsk(p){ const tx = p.dataset.text; if (!tx) return; p.classList.add('manual'); forceAsk(tx, p.dataset.ts || hhmmss(new Date())); }
function forceAsk(tx, ts, alt){
  if (cfg.llm === 'off') { setStatus('回答候補がオフ。設定で提供元を選ぶ'); return; }
  const qid = ++A.qid;
  // 文脈はその文より前の直近10文
  const idx = A.recent.findIndex(r => r.endsWith(' ' + tx)); const before = idx >= 0 ? A.recent.slice(0, idx) : A.recent.slice(0, -1);
  const qs = A.lines.filter(l => ((l.kind === 'seg' && l.level) || l.kind === 'manual') && l.text !== tx).slice(-5).map(l => '[' + (l.t instanceof Date ? hhmmss(l.t) : '') + '] ' + l.text).join('\n');
  const ctx = before.slice(-24).join('\n') + (qs ? '\n\n【少し前に検知した質問（古い→新しい）。指名された文はこの流れの続き】\n' + qs : '');
  const q = document.createElement('p'); q.className = 'qitem'; q.dataset.text = tx; q.dataset.ts = ts; q.innerHTML = '<span class="ts">' + ts + '</span><span></span>'; q.querySelector('span:last-child').textContent = '👆 ' + tx; $('qlog').appendChild(q); $('qlog').scrollTop = $('qlog').scrollHeight;
  A.nq++; $('count').textContent = '質問 ' + A.nq + ' 件';
  const a = document.createElement('div'); a.className = 'ans'; a.id = 'ans' + qid; a.dataset.text = tx; a.dataset.ts = ts; a.innerHTML = '<p class="q"></p><p class="thinking">考え中…</p>'; a.querySelector('.q').textContent = (alt ? 'Q: 👆 別の答え: ' : 'Q: 👆 ') + tx; $('alog').appendChild(a); $('alog').scrollTop = $('alog').scrollHeight;
  A.lines.push({ kind:'manual', t:new Date(), text: tx }); scheduleLogSave();
  askAnswer(qid, tx, ctx, true, alt);
}
$('transcript').addEventListener('click', (e) => { const p = e.target.closest('.line'); if (p) manualAsk(p); });
$('qlog').addEventListener('click', (e) => { const p = e.target.closest('.qitem'); if (p && p.dataset.text) forceAsk(p.dataset.text, p.dataset.ts || hhmmss(new Date())); });
$('alog').addEventListener('click', (e) => {
  const b = e.target.closest('.ans'); if (!b || !b.dataset.text || b.querySelector('.thinking')) return;
  const judged = Array.from(b.querySelectorAll('.judge')).some(p => /質問ではない/.test(p.textContent)); const failed = !!b.querySelector('.err');
  if (judged || failed) { forceAsk(b.dataset.text, b.dataset.ts || hhmmss(new Date())); return; }
  const prev = Array.from(b.querySelectorAll('.a')).map(p => p.textContent).join('\n');
  if (prev) forceAsk(b.dataset.text, b.dataset.ts || hhmmss(new Date()), prev);
});

/* ---------------- ログの自動保存と復元 ----------------
   Safariはメモリ不足やタブの入れ替えでページを読み直すことがあり、画面のログが丸ごと消える。
   1文ごとに localStorage に書き、次に開いた時に戻す。 */
const LOG_KEY = 'lq_log_v1';
let logTimer = null;
function scheduleLogSave(){ clearTimeout(logTimer); logTimer = setTimeout(saveLog, 1500); scheduleSync(); }
function saveLog(){
  clearTimeout(logTimer);
  try { localStorage.setItem(LOG_KEY, JSON.stringify({ at: Date.now(), nq: A.nq, lines: A.lines.map(l => l.t instanceof Date ? Object.assign({}, l, { t: l.t.getTime() }) : l) })); }
  catch (e) { setStatus('ログの自動保存に失敗（容量か設定）。「ログ保存」で書き出す'); }
}
function restoreLog(){
  let j = null; try { j = JSON.parse(localStorage.getItem(LOG_KEY) || 'null'); } catch (e) {}
  if (!j || !j.lines || !j.lines.length) return;
  const tr = $('transcript'); const notice = tr.querySelector('.notice'); if (notice) notice.remove();
  const head = document.createElement('p'); head.className = 'notice'; head.textContent = '前回のログを復元（' + j.lines.length + ' 件・' + new Date(j.at).toLocaleString('ja-JP') + ' まで）。続けるなら開始、消すならクリア'; tr.appendChild(head);
  let lastQ = '';
  for (const l of j.lines) {
    if (l.kind === 'seg') {
      const d = new Date(l.t || j.at); const ts = hhmmss(d); const lv = l.level || 0;
      A.lines.push({ kind:'seg', t: d, text: l.text, level: lv }); A.recent.push('[' + ts + '] ' + l.text); if (A.recent.length > 40) A.recent.shift();
      const p = document.createElement('p'); p.className = 'line' + (lv === 2 ? ' q2' : lv === 1 ? ' q1' : ''); p.dataset.text = l.text; p.dataset.ts = ts;
      p.innerHTML = '<span class="ts">' + ts + '</span><span class="tx"></span>'; p.querySelector('.tx').textContent = (lv === 2 ? '❓ ' : lv === 1 ? '? ' : '') + l.text; tr.appendChild(p);
      if (lv) { A.nq++; const q = document.createElement('p'); q.className = 'qitem' + (lv === 1 ? ' weak' : ''); q.dataset.text = l.text; q.dataset.ts = ts; q.innerHTML = '<span class="ts">' + ts + '</span><span></span>'; q.querySelector('span:last-child').textContent = l.text; $('qlog').appendChild(q); lastQ = l.text; }
    } else if (l.kind === 'manual') {
      const d = new Date(l.t || j.at); A.lines.push({ kind:'manual', t: d, text: l.text }); A.nq++;
      const q = document.createElement('p'); q.className = 'qitem'; q.dataset.text = l.text; q.dataset.ts = hhmmss(d); q.innerHTML = '<span class="ts">' + hhmmss(d) + '</span><span></span>'; q.querySelector('span:last-child').textContent = '👆 ' + l.text; $('qlog').appendChild(q); lastQ = l.text;
    } else if (l.kind === 'answer') {
      A.lines.push({ kind:'answer', q: l.q, answer: l.answer, sec: l.sec });
      const box = document.createElement('div'); box.className = 'ans'; box.dataset.text = l.q || lastQ; box.innerHTML = '<p class="q"></p>'; box.querySelector('.q').textContent = 'Q: ' + (l.q || lastQ) + '　（' + l.sec + '秒）';
      for (const ln of String(l.answer || '').split('\n')) { if (!ln.trim()) continue; const p = document.createElement('p'); if (ln.startsWith('判定')) p.className = 'judge'; else if (ln.startsWith('答え') || ln.startsWith('別解')) p.className = 'a'; else if (ln.startsWith('[失敗')) p.className = 'err'; p.textContent = ln; box.appendChild(p); }
      $('alog').appendChild(box);
    }
  }
  $('count').textContent = '質問 ' + A.nq + ' 件'; tr.scrollTop = tr.scrollHeight; $('qlog').scrollTop = $('qlog').scrollHeight; $('alog').scrollTop = $('alog').scrollHeight;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { saveLog(); syncNow(); } });
window.addEventListener('pagehide', saveLog);

/* ---------------- 録音（任意・先生の許可が前提） ----------------
   聞き取りに使っている同じマイク入力を MediaRecorder で30秒ごとに切り、IndexedDB に積む。
   ページが読み直されても断片は残るので、停止後（または次に開いた時）に「録音を保存」で書き出す（開始〜停止が1本。複数本は1本ずつ）。 */
const R = { rec:null, sess:0, n:0, db:null, mime:'', saveIdx:0 };
function recDb(){ return new Promise((res, rej) => { if (R.db) return res(R.db); if (!window.indexedDB) return rej(new Error('IndexedDBが無い')); const q = indexedDB.open('lq_rec', 1); q.onupgradeneeded = () => { q.result.createObjectStore('chunks', { keyPath:'id', autoIncrement:true }); }; q.onsuccess = () => { R.db = q.result; res(R.db); }; q.onerror = () => rej(q.error); }); }
function recTx(mode, fn){ return recDb().then(db => new Promise((res, rej) => { const tx = db.transaction('chunks', mode); const rq = fn(tx.objectStore('chunks')); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); })); }
function recPut(obj){ return recTx('readwrite', st => st.put(obj)); }
function recAll(){ return recTx('readonly', st => st.getAll()); }
function recClear(){ return recTx('readwrite', st => st.clear()); }
function recStart(){
  if (cfg.rec !== 'yes') return;
  if (!window.MediaRecorder) { setStatus('このブラウザは録音に対応していない（聞き取りは続ける）'); return; }
  const mimes = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']; R.mime = mimes.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; } }) || '';
  try { R.rec = new MediaRecorder(A.stream, Object.assign({ audioBitsPerSecond: 64000 }, R.mime ? { mimeType: R.mime } : {})); }
  catch (e) { setStatus('録音を開始できない: ' + e.message + '（聞き取りは続ける）'); R.rec = null; return; }
  R.sess = Date.now(); R.n = 0; R.saveIdx = 0;
  R.rec.ondataavailable = (ev) => { if (!ev.data || !ev.data.size) return; R.n++; recPut({ sess: R.sess, i: R.n, t: Date.now(), type: ev.data.type || R.mime, blob: ev.data }).then(() => { $('btnRec').hidden = false; }).catch(e => setStatus('録音の断片を保存できない: ' + (e && e.message))); };
  R.rec.onerror = (ev) => setStatus('録音エラー: ' + (ev.error && ev.error.message || ''));
  try { R.rec.start(30000); } catch (e) { setStatus('録音を開始できない: ' + e.message); R.rec = null; }
}
function recStop(){ try { if (R.rec && R.rec.state !== 'inactive') R.rec.stop(); } catch (e) {} R.rec = null; }
async function recSave(){
  // 1回の「開始〜停止」（スリープ復帰でマイクを取り直した時もそこで区切り）が1本。本ごとに別ファイルで書き出す。
  // バイト連結すると2本目以降にファイル頭が混ざって再生できないプレイヤーがあるので、連結はしない。
  let all = [];
  try { all = (await recAll()) || []; } catch (e) { setStatus('録音を読めない: ' + e.message); return; }
  if (!all.length) { setStatus('保存できる録音がない'); $('btnRec').hidden = true; return; }
  all.sort((a, b) => (a.sess - b.sess) || (a.i - b.i));
  const sessions = [...new Set(all.map(c => c.sess))];
  if (R.saveIdx >= sessions.length) R.saveIdx = 0;
  const sess = sessions[R.saveIdx]; const chunks = all.filter(c => c.sess === sess);
  const type = chunks[0].type || 'audio/mp4'; const ext = /mp4/.test(type) ? 'm4a' : /webm/.test(type) ? 'webm' : 'bin';
  const blob = new Blob(chunks.map(c => c.blob), { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lecture_rec_' + new Date(sess).toISOString().slice(0, 16).replace(/[-:T]/g, '') + (sessions.length > 1 ? '_' + (R.saveIdx + 1) : '') + '.' + ext; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  R.saveIdx++;
  setStatus('録音を書き出した（' + (blob.size / 1048576).toFixed(1) + ' MB・' + chunks.length + ' 片' + (sessions.length > 1 ? '・' + R.saveIdx + '/' + sessions.length + ' 本目。もう一度押すと次の本' : '') + '）。全部保存できたら「クリア」で消す');
}
async function recCheck(){ try { const all = await recAll(); if (all && all.length) { $('btnRec').hidden = false; if (!A.running) setStatus('前の録音が残っている（' + all.length + ' 片）。「録音を保存」で書き出すか、「クリア」で消す'); } } catch (e) {} }
$('btnRec').addEventListener('click', recSave);

/* ---------------- 回答候補 ---------------- */
const ROLE = (course) => 'あなたは大学院の授業「' + (course || '（科目名未指定）') + '」を受けている学生の補助者です。先生の発言のリアルタイム文字起こし（誤変換あり）が渡されます。\n1行目に判定を書く: 「判定: 質問」か「判定: 質問ではない」。学生への問いかけ、確認、修辞的な問い、一般知識の質問はすべて「質問」。迷ったら「質問」。\n「質問」なら、その場で口頭で答えるための案を必ず続ける。配付資料に無い内容でも一般知識で答える。時事（現職の人名・最新の数値など）も「分からない」「後で確認」と逃げず、知っている範囲で最も新しい答えを名指しし、「○年○月時点の知識」と一言添える:\n答え: 結論だけを1文（30字前後）\n補足: 根拠や用語を2行以内\n別解: 答えの候補が複数あるときだけ、もう1つの有力候補を1文（無ければ省く）\n根拠: 配付資料の該当箇所（ページ番号や見出し）。資料に無ければ「資料外（一般知識）」\n答えは一般論（注意する、顧客を増やす、ルールを守る等）ではなく、配付資料・教科書・制度史・実務で実際に採られてきた定番の具体策を名指しする。配付資料に該当する記述があればそれを最優先にする。\n全体で7行以内・170字程度。文字起こしの誤りは文脈から補って解釈する。見出し語（判定／答え／補足／根拠）以外の装飾は付けない。';
// Claudeのモデルと思考オフの指定はモデルごとに違う（Haiku=disabled・Sonnet=between_tools。Opus/Fableはadaptiveしか無く3.5秒以上かかるので載せない）
function geminiModel(){ return /^gemini/.test(cfg.asrModel) ? cfg.asrModel : 'gemini-3.5-flash'; }
function claudeModel(){ return cfg.llm === 'sonnet' ? 'claude-sonnet-5-5' : 'claude-haiku-5-5'; }
function claudeThinking(){ return cfg.llm === 'sonnet' ? { type:'between_tools' } : { type:'disabled' }; }
async function askAnswer(qid, q, ctx, force, alt){
  const head = '【直前の講義の文字起こし（古い→新しい）】\n' + (ctx || '（なし）') + '\n\n';
  const user = head + (force
    ? '【学生がタップして指名した発言（必ず答える）】\n' + q + '\n\n学生がこの発言を自分で選んで回答を求めている。質問かどうかの判定はしない。1行目は必ず「判定: 質問（指名）」と書き、2行目から答え・補足・根拠を必ず書く。指名された文は、ほとんどの場合、先生が学生に投げた問い（例:「どうしたらいいですか？」「なに？」）。答えるのは「学生が今何をすべきか」や授業の進め方ではなく、その問いの中身、つまり先生が学生に言わせたい答え。直前の文字起こしと検知した質問の流れから、先生が示した状況・制約・ダメ出し（例: ○○は通らない）を前提に、問いを1文で具体化してから答える。問いの推定は補足の冒頭に「問いの推定: …」と1行で示す。誤変換が多くても、文脈から最も筋の通る解釈を1つ選んで答え、「分からない」「資料を参照」では終わらない。'
    : '【検知した発言（これについて判定と回答案）】\n' + q)
    + (alt ? '\n\n【前回の答え（先生の求める答えではなかった）】\n' + alt + '\n前回と同じ趣旨の答えは出さない。それ以外で、教科書・制度史・実務の定番の具体策を「答え」と「別解」に1つずつ書く。' : '');
  const t0 = Date.now(); let text = '', err = '';
  try {
    if (cfg.llm === 'gemini') {
      let sys = ROLE(cfg.course); if (cfg.notes) sys += '\n\n【配付資料（レジュメ）】\n' + cfg.notes;
      const body = { systemInstruction:{ parts:[{ text: sys }] }, contents:[{ role:'user', parts:[{ text: user }] }], generationConfig:{ temperature:0.2, maxOutputTokens:400, thinkingConfig:{ thinkingBudget:0 } } };
      const j = await geminiJson(geminiModel(), body); const c = (j.candidates || [])[0]; text = c ? ((c.content || {}).parts || []).map(p => p.text || '').join('').trim() : '';
    } else {
      if (!cfg.akey) throw new Error('Anthropicのキーが無い（設定）');
      const system = [{ type:'text', text: ROLE(cfg.course) }]; if (cfg.notes) system.push({ type:'text', text:'【配付資料（レジュメ）】\n' + cfg.notes, cache_control:{ type:'ephemeral' } });
      let body = { model: claudeModel(), max_tokens:400, system, messages:[{ role:'user', content: user }], thinking: claudeThinking() };
      for (let attempt = 0; attempt < 3; attempt++) {
        const r = await fetch(ANTHROPIC_URL, { method:'POST', headers:{ 'content-type':'application/json', 'x-api-key': cfg.akey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' }, body: JSON.stringify(body) });
        if (!r.ok) { const et = await r.text(); if (r.status === 400 && body.thinking) { delete body.thinking; body.max_tokens = 1500; continue; } throw new Error('Claude HTTP ' + r.status + ' ' + et.slice(0, 160)); }
        const j = await r.json(); text = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
        if (!text && j.stop_reason === 'max_tokens' && body.max_tokens < 1500) { body.max_tokens = 1500; continue; }
        break;
      }
    }
  } catch (e) { err = e.message; }
  const sec = ((Date.now() - t0) / 1000).toFixed(1);
  const box = $('ans' + qid); if (!box) return; box.innerHTML = '<p class="q"></p>'; box.querySelector('.q').textContent = 'Q: ' + q + '　（' + sec + '秒）';
  A.lines.push({ kind:'answer', q, answer: err ? '[失敗: ' + err + ']' : text, sec }); scheduleLogSave();
  if (err) { const p = document.createElement('p'); p.className = 'err'; p.textContent = '回答生成に失敗: ' + err; box.appendChild(p); }
  else for (const ln of text.split('\n')) { if (!ln.trim()) continue; const p = document.createElement('p'); if (ln.startsWith('判定')) p.className = 'judge'; else if (ln.startsWith('答え') || ln.startsWith('別解')) p.className = 'a'; p.textContent = ln; box.appendChild(p); }
  $('alog').scrollTop = $('alog').scrollHeight;
}

/* ---------------- 別の端末から読めるようにする（秘密のgistへ送る） ----------------
   設定にGitHubトークン（gist権限のみ）を入れると、ログが変わるたび（10秒に1回まで）と停止時・画面が隠れた時に、
   自分のアカウントの秘密のgistへ全文を書き込む。gistは1つを使い回し、ファイルは日付＋科目ごと（log_YYYY-MM-DD_科目.txt）。
   見る側は gist のページを開いて再読み込みするだけ（トークン不要・URLを知っている人だけ見られる）。 */
const GIST_KEY = 'lq_gist_v1';
const G = { id:null, url:'', owner:'', at:0, timer:null, busy:false, dirty:false };
function gistLoad(){ try { const j = JSON.parse(localStorage.getItem(GIST_KEY) || 'null'); if (j && j.id) { G.id = j.id; G.url = j.url || ''; G.owner = j.owner || ''; G.at = j.at || 0; } } catch (e) {} }
function gistSave(){ try { localStorage.setItem(GIST_KEY, JSON.stringify({ id: G.id, url: G.url, owner: G.owner, at: G.at })); } catch (e) {} }
function ymd(d){ const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function gistFileName(){ const f = A.lines.find(l => l.t instanceof Date); return 'log_' + ymd(f ? f.t : new Date()) + (cfg.course ? '_' + cfg.course.replace(/[\\/:*?"<>|\s]+/g, '_') : '') + '.txt'; }
function gistContent(){ return '科目: ' + (cfg.course || '-') + '\n最終更新: ' + new Date().toLocaleString('ja-JP') + '\n質問 ' + A.nq + ' 件\n\n' + logText() + '\n'; }
function scheduleSync(){ if (!cfg.ghtoken || G.timer) return; G.timer = setTimeout(() => { G.timer = null; syncNow(); }, 10000); }
async function syncNow(){
  if (!cfg.ghtoken || !A.lines.length) return;
  if (G.busy) { G.dirty = true; return; }
  clearTimeout(G.timer); G.timer = null; G.busy = true; G.dirty = false;
  try {
    const files = {}; files[gistFileName()] = { content: gistContent() };
    const headers = { 'Authorization': 'Bearer ' + cfg.ghtoken, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' };
    let r = null;
    if (G.id) r = await fetch('https://api.github.com/gists/' + G.id, { method:'PATCH', headers, body: JSON.stringify({ files }) });
    if (!r || r.status === 404) r = await fetch('https://api.github.com/gists', { method:'POST', headers, body: JSON.stringify({ description: '講義ログ（lecture-q）', public: false, files }) });
    if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 401 ? '（トークンが無効）' : r.status === 403 ? '（gist権限が無いか上限）' : r.status === 422 ? '（内容が大きすぎるか空）' : ''));
    const j = await r.json();
    const created = G.id !== j.id;
    G.id = j.id; G.url = j.html_url || ''; G.owner = (j.owner && j.owner.login) || ''; G.at = Date.now(); gistSave(); updateGistInfo();
    if (created) setStatus('共有先のgistを作った。設定の「共有先を開く」のURLを他の端末で開く');
  } catch (e) { setStatus('共有に失敗: ' + e.message); }
  finally { G.busy = false; if (G.dirty) scheduleSync(); }
}
function updateGistInfo(){
  const el = $('gistInfo'); if (!el) return;
  if (!cfg.ghtoken) { el.textContent = '共有なし（トークンを入れると別の端末から読める）'; return; }
  if (!G.id) { el.textContent = '共有先はまだ無い（最初のログが入って10秒後に作られる）'; return; }
  el.innerHTML = ''; const a = document.createElement('a'); a.href = G.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '共有先を開く'; el.appendChild(a);
  el.appendChild(document.createTextNode('　' + G.url + '（最終送信 ' + (G.at ? new Date(G.at).toLocaleTimeString('ja-JP') : '-') + '）'));
}

/* ---------------- 設定UI ---------------- */
function setStatus(s){ $('status').textContent = s; }
function openSettings(){ loadCfg(); cfgToForm(); $('dlg').showModal(); }    // 開くたびに保存済みの値を読み直す
window.addEventListener('storage', (e) => { if (e.key === LS_KEY) { loadCfg(); applyQuiet(); } });    // 別のタブで保存したら反映
$('btnSettings').addEventListener('click', openSettings);
function cancelSettings(){ loadCfg(); cfgToForm(); A.vocab = buildVocab(cfg.notes); $('dlg').close(); setStatus('設定の変更を取り消した'); }    // 開いてからいじった内容は捨てる
$('btnCancelSettings').addEventListener('click', cancelSettings);
$('dlg').addEventListener('cancel', (e) => { e.preventDefault(); cancelSettings(); });    // Esc も同じ
$('settingsForm').addEventListener('submit', (e) => { e.preventDefault(); formToCfg(); saveCfg(); applyQuiet(); updateGistInfo(); scheduleSync(); A.vocab = buildVocab(cfg.notes); $('dlg').close(); setStatus('設定を保存した' + (A.vocab && cfg.asrVocab === 'yes' ? '（用語 ' + A.vocab.split('、').length + ' 語を聞き取りに反映）' : '')); });
$('notes').addEventListener('input', () => { cfg.notesName = ''; updateNotesInfo(); });
$('notesFile').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return; setStatus('レジュメを読み込み中…');
  try {
    let text = '';
    if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') {
      const pdfjs = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
      const doc = await pdfjs.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise; const parts = [];
      for (let i = 1; i <= doc.numPages; i++) { const pg = await doc.getPage(i); const tc = await pg.getTextContent(); parts.push('--- p' + i + ' ---\n' + tc.items.map(it => it.str).join(' ')); }
      text = '# ' + f.name + '\n' + parts.join('\n');
    } else text = '# ' + f.name + '\n' + await f.text();
    if (text.length > 150000) text = text.slice(0, 150000) + '\n…（以下省略）';
    $('notes').value = text; cfg.notesName = f.name; updateNotesInfo(); setStatus('レジュメを読み込んだ（' + text.length.toLocaleString() + ' 文字）。保存を押す');
  } catch (err) { setStatus('レジュメを読めなかった: ' + err.message + '。本文を貼り付けで入れる'); }
});
$('btnStart').addEventListener('click', startClick);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && A.running) { holdWake(); recover('スリープから復帰'); } });
window.addEventListener('pageshow', () => { if (A.running) { holdWake(); recover('ページ復帰'); } });
window.addEventListener('focus', () => { if (A.running) recover('フォーカス'); });

loadCfg(); if (!cfg.recOn) { cfg.rec = 'yes'; cfg.recOn = 1; saveCfg(); }
if (cfg.asrModel === 'gstt') { cfg.asrModel = 'gemini-3.5-flash'; delete cfg.sa; saveCfg(); }
if (!cfg.llmV2) { if (cfg.llm === 'claude') cfg.llm = 'sonnet'; cfg.llmV2 = 1; saveCfg(); }
if (!cfg.weakV2) { cfg.answerWeak = 'yes'; cfg.weakV2 = 1; saveCfg(); }    // 2026-10-11 疑いにも回答候補を既定で出す（保存済み設定も一度だけ）    // 2026-10-11 回答候補の既定を Sonnet に（保存済み設定も一度だけ）    // Google Speech-to-Text は撤去（2026-10-11）    // 2026-10-11 録音の既定をオンに（保存済みの設定も一度だけ切り替える）
applyQuiet(); cfgToForm(); restoreLog(); recCheck(); gistLoad(); updateGistInfo();
if (cfg.gkey) setStatus('準備OK。開始を押すとマイクの許可を求める' + (cfg.course ? '（' + cfg.course + '）' : ''));
})();
</script>
